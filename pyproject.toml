[project]
name = "docuagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ravikr309", email = "ravi76170kumar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
docuagent = "docuagent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
